# =============================================================================
# dirac042.github.io — Hugo configuration
# Theme: minimal-luxury (themes/minimal-luxury) — design pack "web-minimal-luxury"
# =============================================================================

baseURL = "https://dirac042.github.io/"
title = "dirac042"
languageCode = "ko-kr"
defaultContentLanguage = "ko"
hasCJKLanguage = true
timeZone = "Asia/Seoul"
theme = "minimal-luxury"

enableRobotsTXT = true
enableEmoji = true
rssLimit = 10
copyright = "This work is licensed under a Creative Commons Attribution-NonCommercial 4.0 International License."

[pagination]
pagerSize = 20

[frontmatter]
date = ["date", "publishDate", "lastmod"]
lastmod = ["lastmod", ":git", "date", "publishDate"]
publishDate = ["publishDate", "date"]
expiryDate = ["expiryDate"]

[taxonomies]
tag = "tags"

# -----------------------------------------------------------------------------
# Markdown
# -----------------------------------------------------------------------------
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true                                   # allow raw HTML inside markdown
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false      # standalone images -> <figure>
      [markup.goldmark.parser.attribute]
        block = true
        title = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]        # keep LaTeX untouched for MathJax
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    noClasses = false                                 # monochrome styling lives in the theme CSS
    lineNos = false
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

# -----------------------------------------------------------------------------
# Site parameters
# -----------------------------------------------------------------------------
[params]
  wordmark = "dirac042"
  tagline = "Cozy Place to Learn Anything"
  description = "dirac042's journal — notes on mathematics, computer science and building things."
  dateFormat = "January 2, 2006"      # Go time layout
  latestCount = 5                     # entries shown on the home page
  footerNote = "CC BY-NC 4.0"

  [params.author]
    name = "dirac042"

  # Home hero (typographic by default; set `image` for a full-bleed photo)
  [params.hero]
    label = "Journal — est. 2025"
    headline = "A cozy place to learn anything"
    caption = "Notes on mathematics, computer science &amp; building things"
    # image = "images/hero.jpg"       # relative to /static — full-bleed, desaturated

  # Ink-coloured statement band on the home page (leave `text` empty to hide)
  [params.statement]
    label = "Why this journal exists"
    text = "Capture&nbsp;— Organize&nbsp;— Distill&nbsp;— Express"
    caption = "The fourth step is why these pages exist"
    [params.statement.link]
      text = "Read the first entry"
      url = "posts/나만의-블로그-만들기-0.-나의-생각을-블로그로-표현해보자/"

  # Math: MathJax loads automatically on pages that contain LaTeX
  [params.math]
    always = false
    lib = "https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"

  [[params.socialLinks]]
    name = "GitHub"
    url = "https://github.com/dirac042/"

# -----------------------------------------------------------------------------
# Menu
# -----------------------------------------------------------------------------
[menu]
  [[menu.main]]
    name = "Journal"
    url = "posts/"
    weight = 10
  [[menu.main]]
    name = "Tags"
    url = "tags/"
    weight = 20
  [[menu.main]]
    name = "About"
    url = "about/"
    weight = 30
